name: Build Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Test, build, and verify portable executable
        shell: pwsh
        run: ./build.ps1
      - name: Publish downloadable files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $notes = @'
          PaperFlow 1.1.1 - Windows portable PDF tool.

          Supports ordered merging, insertion into existing PDFs, and splitting to single-page PDFs or PNG/JPG images with numeric names.
          Visible signature appearances can be preserved; original cryptographic signature validity is not transferred to derived files.

          Download PaperFlow-Windows.zip for the complete portable package, or PaperFlow.exe to run directly.
          The build runs the regression suite and verifies the packaged executable before publishing.
          '@
          $notes | Set-Content -LiteralPath release-notes.txt -Encoding utf8
          gh release view v1.1.1 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v1.1.1 dist/PaperFlow.exe dist/PaperFlow-Windows.zip dist/PaperFlow-source.zip --clobber
          } else {
            gh release create v1.1.1 dist/PaperFlow.exe dist/PaperFlow-Windows.zip dist/PaperFlow-source.zip --target $env:GITHUB_SHA --title 'PaperFlow 1.1.1' --notes-file release-notes.txt
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
