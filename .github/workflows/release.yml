name: Build Linux and Windows installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-24.04
            platform: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Prepare Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Prepare Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libfontconfig1 libdbus-1-3 libx11-6 libx11-xcb1 libxext6 libxrender1 libxi6 libsm6 libice6 libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 fonts-noto-cjk xvfb xauth desktop-file-utils
      - name: Test and build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1
      - name: Test and build Linux packages
        if: runner.os == 'Linux'
        run: bash build.sh
      - name: Verify Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: .venv/Scripts/python.exe tools/verify_install.py
      - name: Verify Linux install, desktop GUI and uninstall
        if: runner.os == 'Linux'
        run: .venv/bin/python tools/verify_install.py
      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: PaperFlow-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publish version 1.2.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.txt <<'NOTES'
          纸序 PaperFlow 1.2.0 — Linux 与 Windows 安装包

          Windows 10/11 x64：下载 Windows-x64-Setup.exe，按向导安装；支持开始菜单、可选桌面快捷方式和卸载。
          Ubuntu 24.04+ / Debian 13+ amd64：下载 .deb，用 sudo apt install ./paperflow_1.2.0_amd64.deb 安装。
          Linux 便携版：解压 Linux-x86_64.tar.gz 后运行 PaperFlow，需要桌面运行库。
          同时保留 Windows 便携程序和完整源码包。无需自行安装 Python。

          支持按导入顺序合并、指定位置插入、按数字命名单页 PDF/PNG/JPG 拆分。
          保留签名外观不代表继承数字证书验签效力，原始签名文件请保留。

          两个平台均运行回归测试、打包程序自检，并验证安装后的程序及卸载流程。Linux 额外通过 Xvfb 检查 X11 图形界面。
          NOTES
          if gh release view v1.2.0 >/dev/null 2>&1; then
            gh release upload v1.2.0 release-files/* --clobber
          else
            gh release create v1.2.0 release-files/* --target "$GITHUB_SHA" --title 'PaperFlow 1.2.0 — Linux & Windows' --notes-file release-notes.txt
          fi
