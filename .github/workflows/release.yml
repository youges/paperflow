name: Build Linux and Windows installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-24.04
            platform: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PAPERFLOW_REQUIRE_OFFICE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Prepare Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Prepare Windows Office conversion component
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files\LibreOffice\program\soffice.com')) {
            choco install libreoffice-fresh --yes --no-progress
            if ($LASTEXITCODE -notin @(0, 3010)) { throw 'LibreOffice installation failed' }
            $global:LASTEXITCODE = 0
          }
      - name: Prepare Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libglib2.0-0 libfontconfig1 libdbus-1-3 libx11-6 libx11-xcb1 libxext6 libxrender1 libxi6 libsm6 libice6 libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 libxcb-randr0 libxcb-sync1 libxcb-xfixes0 libxcb-glx0 libxcb-shm0 libxcb-render0 libxcb-util1 libxkbcommon0 libxkbcommon-x11-0 fonts-noto-cjk xvfb xauth desktop-file-utils
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress
      - name: Test and build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1
      - name: Test and build Linux packages
        if: runner.os == 'Linux'
        run: bash build.sh
      - name: Verify Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: .venv/Scripts/python.exe tools/verify_install.py
      - name: Verify Linux install, desktop GUI and uninstall
        if: runner.os == 'Linux'
        run: .venv/bin/python tools/verify_install.py
      - name: Upload verified packages
        uses: actions/upload-artifact@v4
        with:
          name: PaperFlow-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PaperFlow-${{ matrix.platform }}-diagnostics
          path: |
            tmp/install-check-smoke.json
            tmp/release-check/smoke.json
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publish version 1.4.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.txt <<'NOTES'
          纸序 PaperFlow 1.4.0 — PDF 转 Word

          新增独立「PDF 转 Word」页面，支持全文或指定页码导出 .docx。
          可编辑模式重建中文文字、图片、表格，支持加密 PDF 的打开密码。
          修复重建表格的列宽网格，避免 Word/WPS/LibreOffice 中文字被窄列及固定行高裁切。
          原页图片模式按 PDF 的页面尺寸保留可见外观，支持 150/200/300 DPI；图片内文字不可编辑。
          内置转换组件，无需安装 Office 即可将 PDF 转为 Word。文件在本机处理，不上传。
          失败或取消会清理临时结果；原 PDF 保持完整，覆盖已有 Word 前会询问。

          扫描文字识别（OCR）不在本次功能范围内；扫描件请先 OCR 或使用原页图片模式。
          可编辑模式的复杂版式和分页可能因字体及 Office 软件而变化，请核对输出。
          可见签名外观可以保留，转换后的 Word 不继承原 PDF 的数字签名验证效力。
          继续支持 PDF 合并、指定位置插入、数字命名拆分，以及 Office/图片/TXT 转 PDF。
          Office 转 PDF 仍需安装 LibreOffice Writer/Calc/Impress；PDF 转 Word 无此依赖。

          Windows 10/11 x64：下载 Windows-x64-Setup.exe，按向导安装；支持开始菜单、可选桌面快捷方式和卸载。
          Ubuntu 24.04+ / Debian 13+ amd64：下载 .deb，用 sudo apt install ./paperflow_1.4.0_amd64.deb 安装。
          Linux 便携版：解压 Linux-x86_64.tar.gz 后运行 PaperFlow，需要桌面运行库。
          同时保留 Windows 便携程序和完整源码包。无需自行安装 Python。

          支持按导入顺序合并、指定位置插入、按数字命名单页 PDF/PNG/JPG 拆分。
          保留签名外观不代表继承数字证书验签效力，原始签名文件请保留。

          两个平台均执行 PDF 转 Word 两种模式、真实 Word/Excel/PowerPoint 转 PDF 测试、打包自检，以及安装后的转换和卸载验证。Linux 额外通过 Xvfb 检查 X11 图形界面。
          NOTES
          if gh release view v1.4.0 >/dev/null 2>&1; then
            gh release upload v1.4.0 release-files/* --clobber
          else
            gh release create v1.4.0 release-files/* --target "$GITHUB_SHA" --title 'PaperFlow 1.4.0 — PDF 转 Word' --notes-file release-notes.txt
          fi
